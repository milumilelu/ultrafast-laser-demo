[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufdemo"
version = "0.9.1"
description = "七种材料超快激光加工 Demo：逐脉冲事件引擎 + 2.5D 表面高度场（M0 + T07 参考评估器 + T09 界面 + T10 查表 + T11 分相结构 + T14 受限阈值协议 + T16/T17 冻结几何批量 + T18 斜入射与可见性 + 本地 Web 界面）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary-research" }
dependencies = [
  # 实际安装后锁定（见 requirements.lock）；此处只给出下限，不写“全部最新版”
  "numpy>=1.24,<3",
]

# 批次信息 **不放进制版本号**：`0.9.0-k1` 不是合法 PEP 440 版本，
# 会让 `pip install` / `python -m build` 直接失败
# （实测：`project.version must be pep440`）。
# 批次改由独立元数据承载，运行时经 ``ufdemo.BUILD_BATCH`` 与
# ``io.code_version()["build_batch"]`` 读出。
[tool.ufdemo]
build_batch = "L"

[project.optional-dependencies]
table = ["scipy>=1.10"]          # 批次 F（T10）查表与 PCHIP
ui = ["streamlit>=1.30", "plotly>=5.18"]   # 批次 E（T09）
accel = ["numba>=0.58"]          # 批次 I（T16），可选；缺失时回退 NumPy
dev = ["pytest>=7", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

# 随包只读资源：材料卡 / 曲线卡 / 参考快照 / 前端静态文件 / 示例配置。
#
# 为什么用 data-files 而不是把资源搬进 src/ufdemo/_resources：
# 仓库根目录的 data/、webui/、examples/ 是**唯一权威副本**，
# 被 tests/、tools/、docs/ 与材料卡的 cardPath 共同引用。
# 搬进包内需要同步改动约 20 处引用，且会让运行记录里的路径发生变化
# ——为修一个分发问题引入回归风险不划算。data-files 让「一份源文件」
# 同时进 wheel，运行时由 ufdemo.resource_root() 解析 <prefix>/share/ufdemo。
[tool.setuptools.data-files]
"share/ufdemo/data/materials" = ["data/materials/*.json"]
"share/ufdemo/data/curves" = ["data/curves/*.json", "data/curves/*.csv"]
"share/ufdemo/data/references" = ["data/references/*"]
"share/ufdemo/webui" = ["webui/index.html", "webui/README.md"]
"share/ufdemo/webui/css" = ["webui/css/*.css"]
"share/ufdemo/webui/js" = ["webui/js/*.js"]
"share/ufdemo/webui/test" = ["webui/test/*.mjs"]
"share/ufdemo/examples" = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "g01: G01 单脉冲解析基准",
  "g02: G02 十脉冲线性叠加",
  "g03: G03 零输入/边界/阈值",
  "g04: G04 路径与观测算子",
  "g05: G05 文献语义回归（YSZ/SiC 参考评估器）",
  "g06: G06 分相查询/颗粒/铺层/界面截断（批次 G）",
  "g07: G07 斜入射与表面几何（批次 J，已交付：投影/可见性/法向厚度转换）",
  "g08: G08 分组模式与逐脉冲一致（批次 I，已交付：冻结几何批量 + 误差/回退）",
  "g09: G09 受限阈值协议/查表/导出/界面（界面 E、查表 F、受限阈值协议 H 已交付）",
  "u04: U04 实测数据导入与可用性 QA（65+4 条；语义红线/单位成对/异常保留）",
  "u05: U05 数据集权限门槛（观测可放、增量必拦；单位/语义硬门槛）",
  "slow: 需要真实 HTTP 服务/落盘的端到端测试（批次 K 契约层）",
]
